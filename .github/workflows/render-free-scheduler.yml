name: Render Free Scheduler

on:
  schedule:
    - cron: "*/5 0-2 * * 1-5"
  workflow_dispatch:

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NaverNews scheduler
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.SCHEDULER_TOKEN }}" \
            "${{ secrets.NAVERNEWS_SCHEDULER_URL }}"

